  <meta name="theme-color" content="#16213f">
  <meta name="description" content="NOEON TOEFL: подготовка к TOEFL iBT 2026">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="./src/styles/screens.css">
  <link rel="stylesheet" href="./src/styles/exam.css">
  <script>
    /* theme before first paint: no flash */
    (function () {
      var t = 'auto';
      try { t = localStorage.getItem('nt.theme') || 'auto'; } catch (e) {}
      var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <div class="shell">
    <aside class="rail" id="rail"></aside>
    <main id="app" class="app"></main>
  </div>
  <nav class="pill" id="pill" aria-label="Разделы"></nav>
  <div id="layer"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
