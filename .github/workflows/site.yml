name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # API address; can be overridden with a repository variable API_URL
          VITE_API_URL: ${{ vars.API_URL || 'https://noeon-toefl-api.grammar-noeon.workers.dev' }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
