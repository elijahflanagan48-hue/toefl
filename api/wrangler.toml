name = "noeon-toefl-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Comma-separated list of origins allowed to call the API (GitHub Pages site + local dev).
# Audio recordings: R2 bucket noeon-toefl-audio (created 2026-10-30).
ALLOWED_ORIGINS = "https://toefl.noeon.org,https://elijahflanagan48-hue.github.io,http://localhost:5173,http://localhost:4173"
SESSION_DAYS = "60"
AUDIO_MAX_MB = "8"

[[d1_databases]]
binding = "DB"
database_name = "noeon-toefl"
database_id = "003530dc-da14-44e2-b783-6a09b99c5a7b"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "noeon-toefl-audio"
