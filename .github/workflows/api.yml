name: API (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - name: Local database
        run: npx wrangler d1 migrations apply noeon-toefl --local
      - name: Integration tests
        run: |
          npx wrangler dev --local --port 8787 --ip 127.0.0.1 > /tmp/dev.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/health && break; sleep 2; done
          npm test
      - if: failure()
        run: cat /tmp/dev.log

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - name: Audio bucket (R2)
        run: npx wrangler r2 bucket create noeon-toefl-audio || echo "bucket exists or R2 is not enabled yet"
      - name: Database migrations
        run: npx wrangler d1 migrations apply noeon-toefl --remote
      - name: Deploy
        run: npx wrangler deploy
